name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel previous runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: x86_64-pc-windows-gnu, i686-unknown-linux-gnu

    - name: Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          .
          bench

    - name: Check formatting
      run: |
        cargo fmt --all -- --check
        cargo fmt --all --manifest-path bench/Cargo.toml -- --check

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Clippy without symbolize
      run: cargo clippy --all-targets --no-default-features -- -D warnings

    - name: Clippy for Windows
      run: cargo clippy --all-targets --target x86_64-pc-windows-gnu -- -D warnings

    - name: Clippy for 32-bit Linux
      run: cargo clippy --all-targets --target i686-unknown-linux-gnu -- -D warnings

    # Compiles the tests for a 32-bit target without linking them, which
    # finds overflowing constants that cargo check does not
    - name: Build for 32-bit Linux
      run: cargo build --all-targets --target i686-unknown-linux-gnu
      env:
        CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: "true"

    - name: Clippy for the benchmarks
      working-directory: bench
      run: |
        for allocator in ours mimalloc jemalloc; do
          cargo clippy --features "$allocator" -- -D warnings
        done
        cargo clippy -- -D warnings

    - name: Documentation
      run: cargo doc --no-deps
      env:
        RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust 1.88
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.88"

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Check on MSRV
      run: |
        cargo check --all-targets
        cargo check --all-targets --no-default-features

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --release

    - name: Run tests without symbolize
      run: cargo test --release --no-default-features

    # Debug builds check arithmetic overflow inside the allocator
    - name: Run tests in debug
      run: cargo test

  test-32bit:
    name: Test (32-bit Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # A 32-bit toolchain, so that the libraries the tests build with rustc
    # can be loaded by the 32-bit test processes
    - name: Run tests in a 32-bit container
      run: |
        docker run --rm --platform linux/386 -v "$PWD":/work -w /work \
          i386/rust:latest bash -c "cargo test --release && cargo test"

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust nightly with Miri
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Stacked Borrows
      run: cargo miri test --test miri --test miri_wrapper
      env:
        MIRIFLAGS: "-Zmiri-ignore-leaks -Zmiri-permissive-provenance"

    - name: Tree Borrows
      run: cargo miri test --test miri --test miri_wrapper
      env:
        MIRIFLAGS: "-Zmiri-ignore-leaks -Zmiri-permissive-provenance -Zmiri-tree-borrows"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Cache
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate coverage
      run: cargo llvm-cov --release --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        fail_ci_if_error: false

  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check License Headers
      run: |
        # Check that all .rs files have the Apache license header
        missing_license=""
        for file in $(find . -name "*.rs" -not -path "*/target/*" -not -path "./.git/*"); do
          if ! grep -q "Copyright.*Stoolap Contributors" "$file"; then
            missing_license="$missing_license\n$file"
          fi
        done
        if [ ! -z "$missing_license" ]; then
          echo -e "Files missing license header:$missing_license"
          exit 1
        fi
